name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  contents: read
  checks: write  
  pull-requests: write
  pages: write        
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish artifacts
        run: dotnet publish src/BankingCrm.Customers/BankingCrm.Customers.API/BankingCrm.Customers.API.csproj -c Release -o ./publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-app
          path: ./publish

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests per project
        run: |
          mkdir -p ./TestResults
          for proj in $(find ./tests -name '*.csproj'); do
            echo "Running tests for $proj"
            dotnet test "$proj" --configuration Release \
              --logger "trx;LogFileName=$(basename $proj).trx" \
              --results-directory ./TestResults || true
          done
      
      - name: Upload test results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx

      - name: Report test results in GitHub UI
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: .NET Tests
          path: "./TestResults/*.trx"
          reporter: dotnet-trx

      - name: Install ReportGenerator (dotnet global tool)
        if: always()
        run: |
              dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.* || true
              export PATH="$PATH:$HOME/.dotnet/tools"

      - name: Generate HTML test report
        if: always()
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator -reports:./TestResults/*.trx -targetdir:./TestResults/report -reporttypes:"Html;HtmlSummary"

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: ./TestResults/report
      
    
  publish-pages:
      runs-on: ubuntu-latest
      needs: test
      permissions:
        pages: write
        id-token: write
      steps:
          - name: Download HTML report artifact
            uses: actions/download-artifact@v4
            with:
              name: test-report-html
              path: ./report

          - name: Upload Pages artifact
            uses: actions/upload-pages-artifact@v1
            with:
              path: ./report

          - name: Deploy to GitHub Pages
            uses: actions/deploy-pages@v1