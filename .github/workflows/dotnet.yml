name: .NET CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish artifacts
        run: dotnet publish --no-build --configuration Release -o ./publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-app
          path: ./publish

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests (per project)
        run: |
          results_dir=$(pwd)/TestResults
          mkdir -p $results_dir
          for proj in $(find ./tests -type f -name "*.csproj"); do
            echo "Running tests for $proj"
            dotnet test "$proj" --no-build --configuration Release \
              --logger "trx;LogFileName=$(basename $proj)-results.trx" \
              --results-directory $results_dir || true
          done

      - name: Upload test results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx

      - name: Report test results in GitHub UI
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: .NET Tests
          path: "./TestResults/*.trx"
          reporter: dotnet-trx
